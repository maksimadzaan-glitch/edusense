<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>EduSense — Кабинет ученика</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin />
  <link rel="stylesheet" href="/css/student.css?v=190" />
  <link rel="stylesheet" href="/css/oge_rus_exam.css?v=145" />
  <link rel="stylesheet" href="/css/theme.css?v=156" />
  <link rel="stylesheet" href="/css/announce.css?v=159" />
  <link rel="stylesheet" href="/css/chrome.css?v=17" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <link rel="icon" href="/assets/edusense-mark-192.png?v=8" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/edusense-mark-180.png?v=8" />
  <meta name="theme-color" content="#0e1420" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="EduSense" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <script>
    window.__edusenseBip = null;
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      window.__edusenseBip = e;
    });
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="fx" aria-hidden="true">
    <div class="fx-aurora"></div>
    <div class="fx-mesh"></div>
    <div class="fx-beam"></div>
    <div class="fx-mark">
      <span class="mark-e"></span>
      <span class="mark-book"></span>
    </div>
    <div class="fx-cursor"></div>
    <div class="fx-grain"></div>
    <div class="fx-vignette"></div>
  </div>
  <div class="atmosphere" aria-hidden="true">
    <div class="atm-grid"></div>
    <div class="atm-aurora"></div>
    <div class="atm-beam"></div>
    <div class="atm-orb atm-orb-a"></div>
    <div class="atm-orb atm-orb-b"></div>
  </div>
  <div class="noise" aria-hidden="true"></div>
  <div id="announce-root"></div>
  <div id="toast-root"></div>
  <div id="pwa-install-root" hidden></div>
  <div id="tour-root" class="tour-root" hidden></div>
  <div id="app"></div>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin></script>
  <script defer src="/js/math.js?v=38"></script>
  <script defer src="/js/telegram_webapp.js?v=125"></script>
  <script defer src="/js/announce.js?v=130"></script>
  <script defer src="/js/oge_rus_ui.js?v=131"></script>
  <script defer src="/js/math_oge_ui.js?v=3"></script>
  <script defer src="/js/grade_calculator.js?v=1"></script>
  <script defer src="/js/onboarding_tour.js?v=16"></script>
  <script defer src="/js/notifications.js?v=2"></script>
  <script defer src="/js/pwa.js?v=15"></script>
  <script defer src="/js/student.js?v=187"></script>
  <script defer src="/js/ui.js?v=148"></script>
  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        var app = document.getElementById("app");
        if (!app || String(app.innerHTML || "").trim()) return;
        app.innerHTML =
          '<div class="card entry-card" style="max-width:440px;margin:18vh auto;padding:28px;text-align:center">' +
          "<h1>Кабинет не открылся</h1>" +
          '<p class="sub">Обновите страницу или выйдите на главную.</p>' +
          '<p style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px">' +
          '<button type="button" class="btn btn-primary" id="btn-reload-student">Обновить</button>' +
          '<button type="button" class="btn btn-ghost" id="btn-leave-student">На главную</button>' +
          "</p></div>";
        var reload = document.getElementById("btn-reload-student");
        var leave = document.getElementById("btn-leave-student");
        if (reload) reload.onclick = function () { location.reload(); };
        if (leave) {
          leave.onclick = function () {
            try {
              localStorage.removeItem("edusense_user");
              localStorage.removeItem("edusense_student_entry");
              localStorage.removeItem("student_name");
              localStorage.removeItem("class_code");
              localStorage.removeItem("student_id");
              localStorage.removeItem("edusense_student_meta");
              localStorage.removeItem("edusense_student_home");
            } catch (e) {}
            location.href = "/?leave=1";
          };
        }
      }, 2200);
    });
  </script>
</body>
</html>
