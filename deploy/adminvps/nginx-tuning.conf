# Extra hardening against hung mobile connections (FIN-WAIT storms).
# Install on VPS:
#   cp /opt/edusense/deploy/adminvps/nginx-tuning.conf /etc/nginx/conf.d/edusense-tuning.conf
#   nginx -t && systemctl reload nginx

keepalive_timeout 15s;
keepalive_requests 50;
client_header_timeout 15s;
client_body_timeout 15s;
send_timeout 20s;
reset_timedout_connection on;
