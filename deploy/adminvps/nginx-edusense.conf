# EduSense — nginx for edusence.ru + fallback by IP
# Install:
#   cp deploy/adminvps/nginx-edusense.conf /etc/nginx/sites-available/edusense
#   Then re-run certbot if SSL blocks are missing, or keep existing SSL from certbot.

upstream edusense_app {
    server 127.0.0.1:8010;
    keepalive 8;
}

# HTTP: domain + IP (default) → proxy; certbot may add HTTPS redirect later
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name edusence.ru www.edusence.ru _;

    client_max_body_size 25m;

    location / {
        proxy_pass http://edusense_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
