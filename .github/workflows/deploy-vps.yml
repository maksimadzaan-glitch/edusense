name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          script: |
            set -e
            cd /opt/edusense
            # www-data tree + git-as-root → mark safe and keep .git root-owned
            git config --global --add safe.directory /opt/edusense || true
            git config --global --add safe.directory '*' || true
            chown -R root:root /opt/edusense/.git 2>/dev/null || true
            git -c safe.directory=/opt/edusense fetch origin main
            git -c safe.directory=/opt/edusense reset --hard origin/main
            # Runtime must write SQLite (+ -wal/-shm) in the app directory
            chown www-data:www-data /opt/edusense
            chown -R www-data:www-data /opt/edusense/backend /opt/edusense/frontend 2>/dev/null || true
            chown www-data:www-data /opt/edusense/.env /opt/edusense/edusense.db 2>/dev/null || true
            chown www-data:www-data /opt/edusense/edusense.db-wal /opt/edusense/edusense.db-shm /opt/edusense/edusense.db-journal 2>/dev/null || true
            chown -R root:root /opt/edusense/.git 2>/dev/null || true
            systemctl restart edusense
            sleep 3
            systemctl is-active edusense
            curl -sf -m 8 http://127.0.0.1:8010/api/health || curl -sf -m 8 http://127.0.0.1:8010/api/health || true
            echo "Deploy OK: $(git -c safe.directory=/opt/edusense rev-parse --short HEAD)"
