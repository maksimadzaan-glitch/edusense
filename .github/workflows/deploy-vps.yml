name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          script: |
            set -e
            cd /opt/edusense
            git fetch origin main
            git reset --hard origin/main
            # git от root ломает запись SQLite (www-data) → readonly database на /api/register
            chown -R www-data:www-data /opt/edusense
            systemctl restart edusense
            systemctl is-active edusense
            echo "Deploy OK: $(git rev-parse --short HEAD)"
